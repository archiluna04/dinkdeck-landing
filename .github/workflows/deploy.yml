name: Deploy the landing page

# Plain static files — no build step, nothing to compile. `skip_app_build`
# with `app_location: "/"` uploads the repo root as-is, which is exactly what
# this site is. (The app's own workflow does the same thing against a
# prebuilt `dist`; here there is no build to skip past in the first place.)

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "/"
          output_location: ""
          skip_app_build: true

      - name: Say where it went
        run: echo "Deployed to https://dinkdeck.net" >> "$GITHUB_STEP_SUMMARY"
